name: 📦 Manual release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        default: 'feature'
        type: choice
        options:
          - feature
          - bugfix
          - breaking
      publish_now:
        description: 'Publish release immediately (true/false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
        contents: write # to be able to publish a GitHub release
        issues: write # to be able to comment on released issues
        pull-requests: write # to be able to comment on released pull requests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          python-version: '3.13'

      - name: Determine and validate current version
        id: get_version
        run: |
          current_version=$(grep -E '^version =' pyproject.toml | cut -d '"' -f2)
          echo "Current version: $current_version"
          if [[ ! $current_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format in pyproject.toml: $current_version"
            exit 1
          fi
          echo "CURRENT_VERSION=$current_version" >> "$GITHUB_ENV"

      - name: Calculate next version
        id: bump_version
        run: |
          IFS='.' read -r major minor patch <<< "${CURRENT_VERSION}"
          release_type="${{ github.event.inputs.release_type }}"
          if [[ "$release_type" == "feature" ]]; then
            minor=$((minor + 1))
            patch=0
          elif [[ "$release_type" == "bugfix" ]]; then
            patch=$((patch + 1))
          elif [[ "$release_type" == "breaking" ]]; then
            major=$((major + 1))
            minor=0
            patch=0
          else
            echo "Unknown release_type: $release_type"
            exit 1
          fi
          NEXT_VERSION="${major}.${minor}.${patch}"
          echo "Next version: $NEXT_VERSION"
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"

      - name: Check if tag already exists
        run: |
          if git rev-parse "v${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEXT_VERSION} already exists! Aborting release."
            exit 1
          fi

      - name: Generate release notes with KACL
        run: |
          kacl-cli release "${NEXT_VERSION}" -m
          kacl_cli_notes=$(kacl-cli get "${NEXT_VERSION}")
          {
            echo "RELEASE_NOTES<<EOF"
            echo "${kacl_cli_notes}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Update pyproject.toml
        run: |
          sed -i "s/^version = \".*\"$/version = \"${NEXT_VERSION}\"/" pyproject.toml

      - name: Commit version bump and changelog
        run: |
          git config --global user.name "budivoy"
          git config --global user.email "1615976+budivoy@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): ${NEXT_VERSION}"
          git tag "v${NEXT_VERSION}"

      - name: Push commit and tag
        run: |
          git push origin HEAD
          git push origin "v${NEXT_VERSION}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event.inputs.publish_now }}" == "true" ]]; then
            gh release create "v${NEXT_VERSION}" --notes "${RELEASE_NOTES}"
          else
            gh release create "v${NEXT_VERSION}" --notes "${RELEASE_NOTES}" --draft
          fi
