[project]
name = "pycookiex"
version = "0.1.0"
description = "Yet another Python cookiecutter"
readme = "README.md"
authors = [{ name = "budivoy" }]
license = { text = "MIT" }
requires-python = "<4.0,>=3.13"
dependencies = [
    "pytest<9.0.0,>=8.3.2",
    "pytest-cookies<1.0.0,>=0.7.0",
    "ruff<1.0.0,>=0.6.1",
    "attrs<25.0.0,>=24.2.0",
    "mypy<2.0.0,>=1.11.1",
    "mkdocs<2.0.0,>=1.6.0",
    "mkdocs-material<10.0.0,>=9.5.31",
    "mkdocstrings[python]<1.0.0,>=0.29.0",
    "mike<3.0.0,>=2.1.3",
    "python-kacl<1.0.0,>=0.6.1",
    "pre-commit>=4.5.0",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ['tests/'] # Specify the directories to look for tests

[tool.ruff]
target-version = "py313"
indent-width = 4
line-length = 119
exclude = ["*cookiecutter*"]

[tool.ruff.lint]
# By default, enable all the lint rules.
# Add to the ignore list below if you don't want some rules.
# If you need some ignores for certain modules, see tool.ruff.lint.per-file-ignores below.
# For individual ignore cases, prefer inline `# noqa`s within the code.
select = ["ALL"]
ignore = ["ISC001", "COM812"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # "Use of `assert` detected"
    "ARG",  # "Unused function argument". Fixtures are often unused.
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "single"

[tool.mypy]
python_version = "3.13"
plugins = []
exclude = ["{{ cookiecutter.project_slug }}"]

# Enforce strict type checking
strict = true

# Advanced mypy options for optimal type safety
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true

# Handle third-party libraries
ignore_missing_imports = true
